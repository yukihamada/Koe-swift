name: Claude Code Agent

on:
  issue_comment:
    types: [created]
  issues:
    types: [labeled, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && github.event.label.name == 'claude')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c13fde9a37f38822b9f6492bc1b001

      - name: Build prompt from issue
        id: prompt
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          if [ "$EVENT_NAME" = "issues" ]; then
            echo "prompt=イシュー #$ISSUE_NUMBER を実装してください。\nタイトル: $ISSUE_TITLE\n内容:\n$ISSUE_BODY\n\n手順:\n1. feature/$ISSUE_NUMBER-$(echo "$ISSUE_TITLE" | tr ' ' '-' | tr '[:upper:]' '[:lower:]' | head -c 40) ブランチを作成\n2. CLAUDE.md のガイドラインに従って実装\n3. テストがあれば実行して確認\n4. PRを作成してイシュー #$ISSUE_NUMBER をリンク" >> $GITHUB_OUTPUT
          fi

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ steps.prompt.outputs.prompt }}
          claude_args: "--max-turns 20"
